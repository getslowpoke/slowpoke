name: Release

# A tag is a release: the binaries people download, and the images compose pulls. The version
# baked into both is the tag without its "v", which is what the panel compares with the release
# feed when somebody presses "Check for a new version".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/slowpoke-server-linux-$arch" ./cmd/slowpoke-server
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/getslowpoke/slowpoke/internal/agent.Version=$VERSION" \
              -o "dist/slowpoke-agent-linux-$arch" ./cmd/slowpoke-agent
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  images:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The server image carries the agent for both platforms: a machine installs with one
      # command from the server itself, with no registry in the middle.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/server:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/server:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/agent:latest
