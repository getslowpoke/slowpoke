log_format slowpoke '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';

server {
    listen 80;
    access_log /logs/nginx/access.log slowpoke;

    # Docker's resolver and a variable: without them nginx looks the application up once, at
    # startup, and answers 502 for good after the container is rebuilt with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app laravel:9000;

    location / {
        include fastcgi_params;
        fastcgi_pass $app;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}

# The express application, behind this web server and traced by an agent that runs somewhere
# else: nobody sees both sides, so the server has only the host to go by. It is the shape of
# every installation where the proxy and the application are not the same machine.
server {
    listen 81;
    server_name express.lab;
    access_log /logs/nginx/express.log slowpoke;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $expressapp express:3000;
        proxy_pass http://$expressapp;
        proxy_set_header Host $host;
    }
}
